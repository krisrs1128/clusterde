[project]
name = "clusterde_py"
version = "0.1.0"
authors = [
  { name="Kris Sankaran", email="ksankaran@wisc.edu" },
]
description = "Minimal implementation of the ClusterDE Algorithm for marker gene analysis vs. a synthetic null"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.8",
    "numpy>=1.21",
    "pandas>=1.3",
    "scanpy>=1.9",
    "scipy>=1.7",
    "torch>=1.10",
    "scikit-learn>=1.0",
    "scdesigner>=0.0.23",
]

[project.urls]
Homepage = "https://github.com/krisrs1128/clusterde-devel"
Issues = "https://github.com/krisrs1128/clusterde-devel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/clusterde_py"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.version]
source = "vcs"
